name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # While the repository is private, library.properties' url can't be loaded (rule LP042); the lint
    # still runs and reports, but only blocks once the repository is public.
    continue-on-error: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/arduino-lint-action@9a3603836c75e41753e531167395edeb90ba5dae # v3.0.0
        with:
          library-manager: submit   # "update" once AllSense is in the Library Manager
          compliance: strict

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash extras/test/run.sh   # the compact protocol with the shared byte vectors, -Werror

  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: ESP32-S3
            fqbn: esp32:esp32:esp32s3
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketches: |
              - examples/WiFiQuickstart
              - examples/USBQuickstart
              - examples/USBMinimal
              - examples/BLEQuickstart
              - examples/TemplateReader
              - examples/TemplateReaderBLE
          - board: Uno
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            sketches: |
              - examples/USBQuickstart
              - examples/USBMinimal
              - examples/TemplateReader
          - board: Pico
            fqbn: arduino:mbed_rp2040:pico
            platforms: |
              - name: arduino:mbed_rp2040
            sketches: |
              - examples/USBQuickstart
              - examples/USBMinimal
              - examples/TemplateReader
    name: compile (${{ matrix.board }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: arduino/compile-sketches@d7af6619a62e765d91f0a4d65b40cf061537a15d # v1.1.3
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          libraries: |
            - source-path: ./
            - name: WebSockets
            - name: ArduinoJson
          sketch-paths: ${{ matrix.sketches }}
