name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/arduino-lint-action@v2
        with:
          library-manager: submit   # "update" once AllSense is in the Library Manager
          compliance: strict

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash extras/test/run.sh   # the compact protocol with the shared byte vectors, -Werror

  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: ESP32-S3
            fqbn: esp32:esp32:esp32s3
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketches: |
              - examples/WiFiQuickstart
              - examples/USBQuickstart
              - examples/USBMinimal
              - examples/BLEQuickstart
              - examples/TemplateReader
              - examples/TemplateReaderBLE
          - board: Uno
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            sketches: |
              - examples/USBQuickstart
              - examples/USBMinimal
              - examples/TemplateReader
          - board: Pico
            fqbn: arduino:mbed_rp2040:pico
            platforms: |
              - name: arduino:mbed_rp2040
            sketches: |
              - examples/USBQuickstart
              - examples/USBMinimal
              - examples/TemplateReader
    name: compile (${{ matrix.board }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          libraries: |
            - source-path: ./
            - name: WebSockets
            - name: ArduinoJson
          sketch-paths: ${{ matrix.sketches }}
